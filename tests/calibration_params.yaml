# ============================================================================
# Calibration Parameters for ORCA Motor Friction Estimation
# ============================================================================

# ---------------------------------------------------------------------------
# Shaft physical properties
# ---------------------------------------------------------------------------
mass_shaft_kg: 4.00                # measured mass of the motor shaft (kg)
shaft_absolute_length_inches: 36.0  # absolute physical length of the shaft (inches)

# ---------------------------------------------------------------------------
# Motor position range (from AutoZero / IrisGui)
# ---------------------------------------------------------------------------
motor_min_um: 1300                   # minimum shaft position (micrometers)
motor_max_um: 670000                # maximum shaft position (micrometers)

# Experiment position window — calibration data is collected within this range
experiment_min_pos_um: 220000          # start of usable range (micrometers)
experiment_max_pos_um: 520000       # end of usable range (micrometers)

# ---------------------------------------------------------------------------
# Communication
# ---------------------------------------------------------------------------
baud_rate: 1000000
interframe_delay_us: 100
# default_serial_port: "/dev/cu.usbserial-ABA76SF6"
default_serial_port: "/dev/cu.usbserial-1460"

# ---------------------------------------------------------------------------
# Auto-zero
# ---------------------------------------------------------------------------
auto_zero_force_n: 50               # max force during auto-zero (Newtons)
auto_zero_speed_mmps: 100            # max speed during auto-zero (mm/s)

# ---------------------------------------------------------------------------
# Mass estimation trials (constant force procedure)
# ---------------------------------------------------------------------------
# force_levels_mN: [
#                  -7500,
#                  -8000,
#                  -8500,
#                  -9000,
#                  -9500,
#                  -10000,
#                  -10500,
#                  -11000,
#                  -11500,
#                  -12000,
#                  -12500,
#                  -13000,
#                  -13500,
#                  -14000,
#                  -14500,
#                  -15000,
#                 ]
force_levels_mN: [
                 7000,
                 7500,
                 8000,
                 8500,
                 9000,
                 9500,
                 10000,
                 10500,
                 11000,
                 11500,
                 12000,
                 12500,
                 13000,
                 13500,
                 14000,
                 14500,
                 15000,
                 15500,
                 16000,
                 16500,
                 17000,
                 17500,
                 18000,
                 18500,
                 19000,
                 19500,
                 20000
                 ]

iterations_per_force: 5

# ---------------------------------------------------------------------------
# Static friction estimation (force ramp procedure)
# ---------------------------------------------------------------------------
static_num_test_points: 21
friction_force_start_mN: 1000       # starting force for ramp
friction_force_step_mN: 100         # force increment per step
friction_force_max_mN: 15000        # safety cap
friction_samples_per_step: 100      # readings per force level
friction_settle_time_s: 0.05        # pause after changing force before sampling
friction_accel_threshold_mmpss: 50  # min mean |accel| to count as "moving"
friction_pos_change_threshold_um: 50 # min position change to count as "moving"

# ---------------------------------------------------------------------------
# Ramp-down (dynamic friction at low forces)
# ---------------------------------------------------------------------------
# "Running start" protocol: accelerate the shaft with a high startup force,
# then switch to a lower target force mid-travel to capture friction during
# deceleration / low-force coasting — regimes unreachable from rest.
rampdown_startup_force_mN: 15000     # high force to get shaft moving
rampdown_target_forces_mN: [         # forces to step down to (including 0 and negative)
    0,
    1000,
    2000,
    3000,
    4000,
    5000,
    6000,
]
rampdown_switch_positions_um: [       # positions at which the force switches to the target
    270000,
    370000,
]
rampdown_starting_positions_um: [     # starting positions for the shaft before startup force
    220000,
    320000,
    420000,
]
rampdown_iterations_per_combo: 3      # trials per (target_force, switch_position, starting_position) combo

# ---------------------------------------------------------------------------
# Data output
# ---------------------------------------------------------------------------
data_dir: "../data"

# ---------------------------------------------------------------------------
# Analysis: velocity estimation
# ---------------------------------------------------------------------------
# Which velocity estimator to use: "SG" (Savitzky-Golay) or "RW" (rolling window)
#   SG  — fits a polynomial over a symmetric window, then takes the analytical
#          derivative. Non-causal (uses future samples). Good for clean offline
#          analysis but does NOT match the real-time estimator.
#   RW  — rolling mean of finite differences over the last K samples. Causal
#          (no future data). Matches the real-time velocity estimator used in
#          the MWorks control loop, so the friction model trains on the same
#          velocity distribution it will see at inference.
velocity_estimator: "RW"

# Savitzky-Golay parameters (used when velocity_estimator == "SG")
savgol_window: 15                   # window length for Savitzky-Golay filter
savgol_order: 2                     # polynomial order for Savitzky-Golay filter

# Rolling window parameters (used when velocity_estimator == "RW")
rw_window: 5                        # number of finite-difference samples to average

# ---------------------------------------------------------------------------
# Analysis: friction estimation
# ---------------------------------------------------------------------------
t_ignore_s: 0.015                   # ignore first N seconds (static breakaway transient)
static_friction_low_mN: 4750.0      # lower bound of estimated static friction
static_friction_high_mN: 5000.0     # upper bound of estimated static friction

# ---------------------------------------------------------------------------
# Analysis: frame alignment (stream readback delay)
# ---------------------------------------------------------------------------
# The motor's command stream readback (position, force_sensed) lags behind
# real-time acceleration reads by `shift` frames due to USB FIFO buffering.
# force_sensed[i+shift] corresponds to accel[i]. In other words, the
# force_sensed value that matches a given accel read won't appear in the
# stream until `shift` frames later.
# The optimal shift minimizes variance in F_friction = F_sensed - m*a.
stream_force_shift: 3               # frame shift to align force_sensed with accel
# USB-to-serial chip in use (e.g. "FT232R", "FT232H"). Affects USB latency
# and therefore the optimal shift value. FT232R ~1.3 ms/transaction,
# FT232H or PCIe card can be significantly lower.
usb_chip: "FT232H"
