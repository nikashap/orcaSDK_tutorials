# ============================================================================
# Calibration Parameters for ORCA Motor Friction Estimation
# ============================================================================

# ---------------------------------------------------------------------------
# Shaft physical properties
# ---------------------------------------------------------------------------
mass_shaft_kg: 4.00                # measured mass of the motor shaft (kg)
shaft_absolute_length_inches: 36.0  # absolute physical length of the shaft (inches)

# ---------------------------------------------------------------------------
# Motor position range (from AutoZero / IrisGui)
# ---------------------------------------------------------------------------
motor_min_um: 1300                   # minimum shaft position (micrometers)
motor_max_um: 670000                # maximum shaft position (micrometers)

# Experiment position window — calibration data is collected within this range
experiment_min_pos_um: 40000          # start of usable range (micrometers)
experiment_max_pos_um: 630000       # end of usable range (micrometers)

# ---------------------------------------------------------------------------
# Communication
# ---------------------------------------------------------------------------
baud_rate: 1000000
interframe_delay_us: 100
# default_serial_port: "/dev/cu.usbserial-ABA76SF6"
default_serial_port: "/dev/cu.usbserial-1460"

# ---------------------------------------------------------------------------
# Auto-zero
# ---------------------------------------------------------------------------
auto_zero_force_n: 50               # max force during auto-zero (Newtons)
auto_zero_speed_mmps: 100            # max speed during auto-zero (mm/s)

# ---------------------------------------------------------------------------
# Mass estimation trials (constant force procedure)
# ---------------------------------------------------------------------------
force_levels_mN: [7700, -7700, 7800, -7800, 7900, -7900, 8000, -8000]
# force_levels_mN: [14000, 15000]
iterations_per_force: 3

# ---------------------------------------------------------------------------
# Static friction estimation (force ramp procedure)
# ---------------------------------------------------------------------------
static_num_test_points: 7
friction_force_start_mN: 1000       # starting force for ramp
friction_force_step_mN: 100         # force increment per step
friction_force_max_mN: 15000        # safety cap
friction_samples_per_step: 100      # readings per force level
friction_settle_time_s: 0.05        # pause after changing force before sampling
friction_accel_threshold_mmpss: 50  # min mean |accel| to count as "moving"
friction_pos_change_threshold_um: 50 # min position change to count as "moving"

# ---------------------------------------------------------------------------
# Data output
# ---------------------------------------------------------------------------
data_dir: "../data"

# ---------------------------------------------------------------------------
# Analysis: Savitzky-Golay velocity estimation
# ---------------------------------------------------------------------------
savgol_window: 15                   # window length for Savitzky-Golay filter
savgol_order: 2                     # polynomial order for Savitzky-Golay filter

# ---------------------------------------------------------------------------
# Analysis: friction estimation
# ---------------------------------------------------------------------------
t_ignore_s: 0.015                   # ignore first N seconds (static breakaway transient)
static_friction_low_mN: 4750.0      # lower bound of estimated static friction
static_friction_high_mN: 5000.0     # upper bound of estimated static friction

# ---------------------------------------------------------------------------
# Analysis: frame alignment (stream readback delay)
# ---------------------------------------------------------------------------
# The motor's command stream readback (position, force_sensed) lags behind
# real-time acceleration reads by several frames due to USB latency buffering.
# A positive shift means force_mN is shifted forward by `shift` frames to align
# with the corresponding accel_mmpss sample. A negative shift means backward.
# The optimal shift minimizes variance in F_friction = F_sensed - m*a.
stream_force_shift: 3               # frame shift to align force_sensed with accel
# USB-to-serial chip in use (e.g. "FT232R", "FT232H"). Affects USB latency
# and therefore the optimal shift value. FT232R ~1.3 ms/transaction,
# FT232H or PCIe card can be significantly lower.
usb_chip: "FT232H"
