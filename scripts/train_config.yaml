# ============================================================================
# Friction Model Training Configuration
# ============================================================================

# ---------------------------------------------------------------------------
# Data preparation
# ---------------------------------------------------------------------------
# List of date folder names under orcaSDK_tutorials/data/ to include.
# Each must contain a stribeck_data.npz and calibration_params.yaml.
data_dates:
 - "26_04_14-14_49_13"
 - "26_04_14-15_12_51"
 - "26_04_15-15_15_28"
 - "26_04_15-15_37_48"
 - "26_04_15-16_12_01"
 - "26_04_15-17_33_39"
 - "26_04_16-13_38_24"
 - "26_04_16-14_05_13"
 - "26_04_16-14_38_01"
 - "26_04_16-15_02_08"
 - "26_04_16-17_07_14"
 - "26_04_16-17_51_38"
 - "26_04_16-18_20_29"
 - "26_04_21-14_25_29"
 - "26_04_22-16_12_50"
 - "26_04_22-18_28_50"
 - "26_04_22-18_53_49"
 - "26_04_22-19_24_12"
 - "26_04_22-19_52_04"
 - "26_04_23-11_37_51"
 - "26_04_23-12_10_12"
 - "26_04_23-13_59_16"
 - "26_04_24-15_54_04"
 - "26_04_24-17_06_58"
 - "26_04_26-16_21_44"
 - "26_04_26-18_27_02"
 - "26_04_27-14_52_55"


# Train / validation / test split ratios (by trial, not by sample).
# Must sum to 1.0.
train_ratio: 0.7
val_ratio: 0.15
test_ratio: 0.15

# Random seed for reproducible trial shuffling and weight init
seed: 42

# Discard samples from the first t_ignore_s seconds of each trial
# (static breakaway transient). Loaded from the experiment YAML by default;
# set here to override.
# t_ignore_s_override: null

# ---------------------------------------------------------------------------
# Model architecture
# ---------------------------------------------------------------------------
# Model variant determines input features (all predict force_realized):
#   1: position, velocity, force_sensed                          (3 inputs)
#   2: position, velocity, accel_prev, force_sensed              (4 inputs)
model_variant: 1

hidden_dims: [32, 32]        # list of hidden layer widths
activation: "relu"           # "relu", "tanh", "leaky_relu", "gelu", "elu"
dropout: 0.0                 # dropout probability (0 = no dropout)

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
batch_size: 256
epochs: 300
learning_rate: 1.0e-3
weight_decay: 1.0e-4         # L2 regularization
lr_scheduler: "plateau"      # "plateau", "cosine", or "none"
plateau_patience: 10         # epochs with no val improvement before LR reduction
plateau_factor: 0.5          # LR multiplied by this on plateau
early_stopping_patience: 50  # stop if val loss doesn't improve for N epochs (0 = disabled)

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
# All outputs (model checkpoint, training curves, config snapshot) are saved
# to this directory. Relative paths are resolved from orcaSDK_tutorials/.
# Absolute paths (e.g. /orcd/data/...) are used as-is.
output_dir: "models/friction"

# Optional: override dataset location (defaults to output_dir/friction_dataset.npz)
# dataset_path: "/orcd/data/mjaz/001/nikashap/models/friction/friction_dataset.npz"
